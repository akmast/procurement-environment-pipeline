name: Run Pipeline

# Manual trigger only. Never runs the pandas/pyarrow/shapely pipeline on
# the GitHub runner itself — this workflow only calls StartExecution on
# the relevant Step Functions state machine and reports how to observe
# it (Fargate does the actual work, see infrastructure/terraform/step_functions.tf).
on:
  workflow_dispatch:
    inputs:
      state_machine:
        description: "Which state machine to start"
        required: true
        type: choice
        options:
          - update
          - historical
          - bootstrap-reference
      sources:
        description: "Space-separated source families (eea ted eurostat) — ignored for bootstrap-reference"
        required: false
        default: "eea ted eurostat"
      countries:
        description: "Space-separated ISO2 country codes"
        required: false
        default: "DE PL"
      from_year:
        description: "Start year — required for historical, ignored otherwise"
        required: false
      to_year:
        description: "End year — required for historical, ignored otherwise"
        required: false
      run_id:
        description: "Resume: reuse a previous run's run_id (from its execution input/manifests) instead of starting a fresh one. Ignored for bootstrap-reference. Leave empty for a normal new run."
        required: false
      start_stage:
        description: "Resume: skip straight to this stage for every requested source, reading the prior stage's manifest from the reused run_id. Only meaningful together with run_id — ignored for bootstrap-reference."
        required: false
        type: choice
        options:
          - ingestion
          - normalization
          - transformation

permissions:
  contents: read
  id-token: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Resolve state machine ARN
        id: sm
        env:
          STATE_MACHINE: ${{ inputs.state_machine }}
        run: |
          case "${STATE_MACHINE}" in
            update) NAME="UpdateStateMachine" ;;
            historical) NAME="HistoricalStateMachine" ;;
            bootstrap-reference) NAME="BootstrapReferenceStateMachine" ;;
            *) echo "Unknown state_machine input: ${STATE_MACHINE}" >&2; exit 1 ;;
          esac
          ARN=$(aws stepfunctions list-state-machines \
            --query "stateMachines[?name=='${NAME}'].stateMachineArn | [0]" --output text)
          if [ "${ARN}" = "None" ] || [ -z "${ARN}" ]; then
            echo "State machine ${NAME} not found — has infrastructure been deployed (see deploy.yml)?" >&2
            exit 1
          fi
          echo "arn=${ARN}" >> "$GITHUB_OUTPUT"
          echo "name=${NAME}" >> "$GITHUB_OUTPUT"

      - name: Build execution input
        id: input
        env:
          STATE_MACHINE: ${{ inputs.state_machine }}
          SOURCES: ${{ inputs.sources }}
          COUNTRIES: ${{ inputs.countries }}
          FROM_YEAR: ${{ inputs.from_year }}
          TO_YEAR: ${{ inputs.to_year }}
          RUN_ID: ${{ inputs.run_id }}
          START_STAGE: ${{ inputs.start_stage }}
        run: |
          PAYLOAD=$(python3 - <<'PYEOF'
          import json
          import os
          import sys

          state_machine = os.environ["STATE_MACHINE"]
          countries_csv = ",".join(os.environ["COUNTRIES"].split())
          sources = os.environ["SOURCES"].split()
          run_id = os.environ.get("RUN_ID", "").strip()
          start_stage = os.environ.get("START_STAGE", "").strip()

          if state_machine == "bootstrap-reference":
              if run_id or start_stage:
                  print("run_id/start_stage are not supported for bootstrap-reference", file=sys.stderr)
                  sys.exit(1)
              payload = {"countries_csv": countries_csv}
          elif state_machine == "update":
              payload = {"sources": sources, "countries_csv": countries_csv}
          elif state_machine == "historical":
              from_year = os.environ.get("FROM_YEAR", "").strip()
              to_year = os.environ.get("TO_YEAR", "").strip()
              if not from_year or not to_year:
                  print("historical requires from_year and to_year", file=sys.stderr)
                  sys.exit(1)
              payload = {
                  "sources": sources,
                  "countries_csv": countries_csv,
                  "from_year": int(from_year),
                  "to_year": int(to_year),
              }
          else:
              print(f"Unknown state_machine: {state_machine}", file=sys.stderr)
              sys.exit(1)

          # Resume support (update/historical only): start_stage only makes
          # sense together with a reused run_id — without it there's no
          # prior stage's manifest to read (see the state machines' own
          # top-level Comment). Fail loudly on a start_stage with no run_id
          # rather than silently running from ingestion anyway.
          if state_machine in ("update", "historical"):
              if start_stage and start_stage != "ingestion" and not run_id:
                  print("start_stage requires run_id (nothing to resume from otherwise)", file=sys.stderr)
                  sys.exit(1)
              if run_id:
                  payload["run_id"] = run_id
                  payload["start_stage"] = start_stage or "ingestion"

          print(json.dumps(payload))
          PYEOF
          )
          echo "payload=${PAYLOAD}" >> "$GITHUB_OUTPUT"

      - name: Start execution
        id: start
        env:
          STATE_MACHINE_ARN: ${{ steps.sm.outputs.arn }}
          PAYLOAD: ${{ steps.input.outputs.payload }}
        run: |
          EXECUTION_ARN=$(aws stepfunctions start-execution \
            --state-machine-arn "${STATE_MACHINE_ARN}" \
            --input "${PAYLOAD}" \
            --query "executionArn" --output text)
          echo "execution_arn=${EXECUTION_ARN}" >> "$GITHUB_OUTPUT"

      - name: Print how to observe this run
        env:
          STATE_MACHINE: ${{ steps.sm.outputs.name }}
          EXECUTION_ARN: ${{ steps.start.outputs.execution_arn }}
          PAYLOAD: ${{ steps.input.outputs.payload }}
          AWS_REGION_NAME: ${{ vars.AWS_REGION }}
        run: |
          {
            echo "## Pipeline run started"
            echo "- State machine: \`${STATE_MACHINE}\`"
            echo "- Execution ARN: \`${EXECUTION_ARN}\`"
            echo "- Input: \`${PAYLOAD}\`"
            echo ""
            echo "**AWS Console:**"
            echo "https://${AWS_REGION_NAME}.console.aws.amazon.com/states/home?region=${AWS_REGION_NAME}#/v2/executions/details/${EXECUTION_ARN}"
            echo ""
            echo "**CLI:**"
            echo '```'
            echo "aws stepfunctions describe-execution --execution-arn ${EXECUTION_ARN}"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
